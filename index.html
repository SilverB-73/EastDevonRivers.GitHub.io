<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local River Levels Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f2f1;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      height: 100vh;
      padding: 10px;
    }
    .grid-item {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #b1b4b6;
    }
    .grid-header {
      background: #1d70b8;
      color: white;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
    }
    .grid-header a {
      color: white;
      text-decoration: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <div class="grid-item">
      <div class="grid-header">
        <a href="https://www.floodradar.co.uk/widget/devon-exeter-trews-weir" target="_blank">River Exe at Trews Weir. Normal range 3.28m to 4.00m</a>
      </div>
      <iframe src="https://www.floodradar.co.uk/widget/devon-exeter-trews-weir" style="border:none;max-width:100%;" loading="lazy" title="River level - FloodRadar"></iframe>
    <div class="grid-footer">
      <a href="https://check-for-flooding.service.gov.uk/station/3251"target="_new">UK Gov webpage</a>
        </div>
    </div>

     <div class="grid-item">
      <div class="grid-header">
        <a href="https://www.floodradar.co.uk/widget/devon-cowley-cowley-bridge" target="_blank">River Creedy at Cowley Bridge. Normal range 0.13m to 2.50m</a>
      </div>
  <iframe src="https://www.floodradar.co.uk/widget/devon-cowley-cowley-bridge" style="border:none;max-width:100%;" loading="lazy" title="River level - FloodRadar"></iframe>
    <div class="grid-footer">
      <a href="https://check-for-flooding.service.gov.uk/station/3261"target="_new">UK Gov webpage</a>
        </div>
  </div>
  
    <div class="grid-item">
      <div class="grid-header">
        <a href="https://www.floodradar.co.uk/widget/devon-bradninch-hele-station-road" target="_blank">River Culm at Bradninch Hele Station Road. Normal range 0.99m to 2.15m</a>
      </div>
   <iframe src="https://www.floodradar.co.uk/widget/devon-bradninch-hele-station-road" style="border:none;max-width:100%;" loading="lazy" title="River level - FloodRadar"></iframe>
      <div class="grid-footer">
      <a href="https://check-for-flooding.service.gov.uk/station/9430"target="_new">UK Gov webpage</a>
        </div>
    </div>

    <div class="grid-item">
      <div class="grid-header">
        <a href="https://www.floodradar.co.uk/widget/devon-colaton-raleigh-dotton" target="_blank">River Otter at Dotton. Normal range 0.22m to 1.40m</a>
      </div>
      <iframe src="https://www.floodradar.co.uk/widget/devon-colaton-raleigh-dotton" style="border:none;max-width:100%;" loading="lazy" title="River level - FloodRadar"></
  <div class="grid-footer">
      <a href="https://check-for-flooding.service.gov.uk/station/3237"target="_new">UK Gov webpage</a>
        </div>
    </div>
   

</body>
</html>
